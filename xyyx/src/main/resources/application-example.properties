spring.datasource.url=jdbc:mysql://localhost:3306/xyyx_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.configuration.map-underscore-to-camel-case=true

# Casdoor OAuth2/OIDC Resource Server.
# Keep this equal to the issuer value returned by Casdoor discovery:
#   http://localhost:8000/.well-known/openid-configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8000

# Casdoor admin API (用于开通/删除员工时同步到 Casdoor)
casdoor.endpoint=http://localhost:8000
casdoor.organization=xyyx
casdoor.application=xyyx
casdoor.client-id=xyyx-web
casdoor.client-secret=<set-in-application.properties>

# Phone privacy keys. Values are Base64-encoded 32-byte keys, supplied by env or
# private config only. Format: version:base64,version2:base64
xyyx.phone-privacy.enc-key-version=${XYYX_PHONE_ENC_KEY_VERSION:v1}
xyyx.phone-privacy.enc-keys=${XYYX_PHONE_ENC_KEYS:}
xyyx.phone-privacy.hash-key-version=${XYYX_PHONE_HASH_KEY_VERSION:v1}
xyyx.phone-privacy.hash-keys=${XYYX_PHONE_HASH_KEYS:}
