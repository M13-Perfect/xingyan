# 容器专用配置：所有值来自 docker-compose 注入的环境变量。
# 通过 SPRING_CONFIG_ADDITIONAL_LOCATION=/config/ 挂载生效。
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.configuration.map-underscore-to-camel-case=true

# issuer 必须等于浏览器访问 Casdoor 的地址（token 的 iss 声明），JWKS 拉取走容器内网
spring.security.oauth2.resourceserver.jwt.issuer-uri=${CASDOOR_PUBLIC_URL}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://casdoor:8000/.well-known/jwks

casdoor.endpoint=http://casdoor:8000
casdoor.organization=xyyx
casdoor.application=xyyx
casdoor.client-id=xyyx-web
casdoor.client-secret=${CASDOOR_CLIENT_SECRET}

xyyx.phone-privacy.enc-key-version=${XYYX_PHONE_ENC_KEY_VERSION:v1}
xyyx.phone-privacy.enc-keys=${XYYX_PHONE_ENC_KEYS:}
xyyx.phone-privacy.hash-key-version=${XYYX_PHONE_HASH_KEY_VERSION:v1}
xyyx.phone-privacy.hash-keys=${XYYX_PHONE_HASH_KEYS:}
