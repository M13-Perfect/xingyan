# 全栈一键部署：MySQL + Casdoor + 后端 + 前端(nginx)
# 用法见 docs/deployment/vps-docker.md；配置全部来自同目录 .env（由 .env.example 复制）。
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次建库：先跑全量 bootstrap（自带 CREATE DATABASE 与种子行），再按序跑增量迁移
      - ../../xyyx_db.sql:/docker-entrypoint-initdb.d/00-bootstrap.sql:ro
      - ./mysql-init/10-migrations.sh:/docker-entrypoint-initdb.d/10-migrations.sh:ro
      - ../../db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 40

  casdoor:
    image: casbin/casdoor:latest
    restart: unless-stopped
    ports:
      - "${CASDOOR_PORT:-8000}:8000"
    environment:
      - GIN_MODE=release
    volumes:
      - ./casdoor-conf:/conf
      - casdoor-logs:/logs

  backend:
    build: ../../xyyx
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      casdoor:
        condition: service_started
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: /config/
      DB_URL: jdbc:mysql://mysql:3306/xyyx_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      # 浏览器访问 Casdoor 用的公网地址（token 的 issuer 会等于它）；JWKS 走容器内网
      CASDOOR_PUBLIC_URL: ${CASDOOR_PUBLIC_URL}
      CASDOOR_CLIENT_SECRET: ${CASDOOR_CLIENT_SECRET}
      XYYX_PHONE_ENC_KEY_VERSION: ${XYYX_PHONE_ENC_KEY_VERSION:-v1}
      XYYX_PHONE_ENC_KEYS: ${XYYX_PHONE_ENC_KEYS}
      XYYX_PHONE_HASH_KEY_VERSION: ${XYYX_PHONE_HASH_KEY_VERSION:-v1}
      XYYX_PHONE_HASH_KEYS: ${XYYX_PHONE_HASH_KEYS}
    volumes:
      - ./backend-application.properties:/config/application.properties:ro

  frontend:
    build:
      context: ../../xyyx/xyyx-frontend
      args:
        VITE_CASDOOR_BASE_URL: ${CASDOOR_PUBLIC_URL}
        VITE_CASDOOR_REDIRECT_URI: ${FRONTEND_PUBLIC_URL}/auth/callback
        VITE_CASDOOR_CLIENT_ID: xyyx-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  casdoor-logs:
